version: 1
name: batch_size_sweep
hypothesis: "Batch size 64 provides the best throughput-to-loss ratio"
question: q1
moonshot: false

runner:
  backend: local
  command: "python3 experiments/train.py --lr 0.001 --batch-size {batch_size} --optimizer adam --seed 42"
  working_dir: .
  timeout_seconds: 30

defaults:
  lr: 0.001
  optimizer: adam

grid:
  batch_size: [8, 16, 32, 64, 128, 256]

metrics:
  primary: throughput
  direction: maximize
  collect:
    - name: loss
      pattern: "Loss: ([\\d.]+)"
      type: float
    - name: accuracy
      pattern: "Accuracy: ([\\d.]+)"
      type: float
    - name: throughput
      pattern: "Throughput: ([\\d.]+)"
      type: float

stopping:
  window: 3
  threshold: 0.05
  max_failures: 3
